<svg viewBox="0 0 780 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ddiv-t"><title id="ddiv-t">Divisor de tensão entre o receptor de 433 MHz e o ESP8266</title><path d="M250 74 V346" stroke="#5AA9F0" stroke-width="2.6" fill="none"/><rect x="100.0" y="22" width="300" height="52" rx="9" fill="#0E1526" stroke="#FF5B52" stroke-opacity="0.7"/><text x="250.0" y="45.0" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="13.5" font-weight="700" fill="#D6E2F2">DATA do receptor 433 MHz</text><text x="250.0" y="63.0" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="11.5" font-weight="600" fill="#FF5B52">5 V — não pode ir direto</text><rect x="235" y="104" width="30" height="52" rx="7" fill="#D9BD8F" stroke="#B99B6D"/><rect x="235" y="111" width="30" height="4.5" fill="#8B4A16"/><rect x="235" y="121" width="30" height="4.5" fill="#1A1A1A"/><rect x="235" y="131" width="30" height="4.5" fill="#E08A2E"/><rect x="235" y="141" width="30" height="4.5" fill="#D4AF37"/><text x="284.0" y="135.0" text-anchor="start" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="13" font-weight="700" fill="#D6E2F2">10 kΩ</text><rect x="235" y="212" width="30" height="52" rx="7" fill="#D9BD8F" stroke="#B99B6D"/><rect x="235" y="219" width="30" height="4.5" fill="#8B4A16"/><rect x="235" y="229" width="30" height="4.5" fill="#1A1A1A"/><rect x="235" y="239" width="30" height="4.5" fill="#E08A2E"/><rect x="235" y="249" width="30" height="4.5" fill="#D4AF37"/><text x="284.0" y="243.0" text-anchor="start" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="13" font-weight="700" fill="#D6E2F2">10 kΩ</text><rect x="235" y="284" width="30" height="52" rx="7" fill="#D9BD8F" stroke="#B99B6D"/><rect x="235" y="291" width="30" height="4.5" fill="#8B4A16"/><rect x="235" y="301" width="30" height="4.5" fill="#1A1A1A"/><rect x="235" y="311" width="30" height="4.5" fill="#E08A2E"/><rect x="235" y="321" width="30" height="4.5" fill="#D4AF37"/><text x="284.0" y="315.0" text-anchor="start" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="13" font-weight="700" fill="#D6E2F2">10 kΩ</text><text x="400.0" y="279.0" text-anchor="start" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="11.5" font-weight="500" fill="#7E90AC">os dois em série somam 20 kΩ</text><path d="M250 186 H460" stroke="#45D964" stroke-width="2.6"/><circle cx="250" cy="186" r="5.5" fill="#45D964"/><rect x="465.0" y="160" width="250" height="52" rx="9" fill="#0E1526" stroke="#45D964" stroke-opacity="0.7"/><text x="590.0" y="183.0" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="13.5" font-weight="700" fill="#D6E2F2">D2 do ESP8266</text><text x="590.0" y="201.0" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="11.5" font-weight="600" fill="#45D964">3,33 V — dentro do limite</text><path d="M227.0 350 H273.0" stroke="#8CA0BE" stroke-width="3"/><path d="M235.0 358 H265.0" stroke="#8CA0BE" stroke-width="3"/><path d="M242.5 366 H257.5" stroke="#8CA0BE" stroke-width="3"/><text x="284.0" y="366.0" text-anchor="start" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="12" font-weight="600" fill="#8CA0BE">G do ESP</text><text x="30.0" y="400.0" text-anchor="start" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="13" font-weight="600" fill="#7E90AC">5 V × 20 kΩ ÷ (10 kΩ + 20 kΩ) = 3,33 V</text></svg>