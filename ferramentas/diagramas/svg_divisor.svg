<svg viewBox="0 0 960 610" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ddiv-t"><title id="ddiv-t">Ligação do módulo receptor de 433 MHz ao ESP8266, com o divisor de tensão</title><rect x="185" y="20" width="270" height="90" rx="8" fill="#132038" stroke="#22304E"/><text x="320.0" y="52.0" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="13" font-weight="700" fill="#D6E2F2">módulo receptor</text><text x="320.0" y="71.0" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="12" font-weight="500" fill="#7E90AC">433 MHz</text><rect x="224" y="110" width="12" height="16" rx="2" fill="#5AA9F0"/><text x="230.0" y="102.0" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="11" font-weight="700" fill="#CFE6FF">VCC</text><rect x="284" y="110" width="12" height="16" rx="2" fill="#5AA9F0"/><text x="290.0" y="102.0" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="11" font-weight="700" fill="#CFE6FF">DATA</text><rect x="344" y="110" width="12" height="16" rx="2" fill="#3A4A66"/><text x="350.0" y="102.0" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="11" font-weight="700" fill="#3A4A66">DATA</text><rect x="404" y="110" width="12" height="16" rx="2" fill="#5AA9F0"/><text x="410.0" y="102.0" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="11" font-weight="700" fill="#CFE6FF">GND</text><text x="480.0" y="118.0" text-anchor="start" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="11.5" font-weight="600" fill="#7E90AC">os dois DATA são o mesmo ponto</text><text x="480.0" y="136.0" text-anchor="start" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="11.5" font-weight="600" fill="#7E90AC">por dentro da plaquinha: use um</text><text x="480.0" y="154.0" text-anchor="start" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="11.5" font-weight="600" fill="#7E90AC">e deixe o outro livre.</text><path d="M230 126 V196 H175" stroke="#FF5B52" stroke-width="2.6" fill="none" stroke-linejoin="round"/><rect x="25" y="171" width="145" height="50" rx="9" fill="#0E1526" stroke="#FF5B52" stroke-opacity="0.7"/><text x="97.5" y="194.0" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="13" font-weight="700" fill="#D6E2F2">VU</text><text x="97.5" y="211.0" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="11" font-weight="600" fill="#FF5B52">o 5 V da USB</text><path d="M410 126 V196 H560" stroke="#8CA0BE" stroke-width="2.6" fill="none" stroke-linejoin="round"/><rect x="560" y="171" width="150" height="50" rx="9" fill="#0E1526" stroke="#8CA0BE" stroke-opacity="0.7"/><text x="635.0" y="194.0" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="13" font-weight="700" fill="#D6E2F2">G</text><text x="635.0" y="211.0" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="11" font-weight="600" fill="#8CA0BE">o terra do ESP</text><path d="M290 126 V536" stroke="#5AA9F0" stroke-width="2.6" fill="none"/><rect x="275" y="225" width="30" height="50" rx="7" fill="#D9BD8F" stroke="#B99B6D"/><rect x="275" y="232.0" width="30" height="4.5" fill="#8B4A16"/><rect x="275" y="241.5" width="30" height="4.5" fill="#1A1A1A"/><rect x="275" y="251.0" width="30" height="4.5" fill="#E08A2E"/><rect x="275" y="260.5" width="30" height="4.5" fill="#D4AF37"/><text x="320.0" y="255.0" text-anchor="start" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="13" font-weight="700" fill="#D6E2F2">10 kΩ</text><rect x="275" y="375" width="30" height="50" rx="7" fill="#D9BD8F" stroke="#B99B6D"/><rect x="275" y="382.0" width="30" height="4.5" fill="#8B4A16"/><rect x="275" y="391.5" width="30" height="4.5" fill="#1A1A1A"/><rect x="275" y="401.0" width="30" height="4.5" fill="#E08A2E"/><rect x="275" y="410.5" width="30" height="4.5" fill="#D4AF37"/><text x="320.0" y="405.0" text-anchor="start" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="13" font-weight="700" fill="#D6E2F2">10 kΩ</text><rect x="275" y="453" width="30" height="50" rx="7" fill="#D9BD8F" stroke="#B99B6D"/><rect x="275" y="460.0" width="30" height="4.5" fill="#8B4A16"/><rect x="275" y="469.5" width="30" height="4.5" fill="#1A1A1A"/><rect x="275" y="479.0" width="30" height="4.5" fill="#E08A2E"/><rect x="275" y="488.5" width="30" height="4.5" fill="#D4AF37"/><text x="320.0" y="483.0" text-anchor="start" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="13" font-weight="700" fill="#D6E2F2">10 kΩ</text><text x="320.0" y="447.0" text-anchor="start" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="11.5" font-weight="500" fill="#7E90AC">os dois em série somam 20 kΩ</text><path d="M290 330 H640" stroke="#45D964" stroke-width="2.6"/><circle cx="290" cy="330" r="5.5" fill="#45D964"/><rect x="645" y="305" width="250" height="50" rx="9" fill="#0E1526" stroke="#45D964" stroke-opacity="0.7"/><text x="770.0" y="328.0" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="13" font-weight="700" fill="#D6E2F2">D2 do ESP8266</text><text x="770.0" y="345.0" text-anchor="middle" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="11" font-weight="600" fill="#45D964">3,33 V — dentro do limite</text><path d="M267.0 540 H313.0" stroke="#8CA0BE" stroke-width="3"/><path d="M275.0 548 H305.0" stroke="#8CA0BE" stroke-width="3"/><path d="M282.5 556 H297.5" stroke="#8CA0BE" stroke-width="3"/><text x="320.0" y="556.0" text-anchor="start" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="12" font-weight="600" fill="#8CA0BE">o mesmo G do ESP</text><text x="30.0" y="594.0" text-anchor="start" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace" font-size="13" font-weight="600" fill="#7E90AC">5 V × 20 kΩ ÷ (10 kΩ + 20 kΩ) = 3,33 V</text></svg>